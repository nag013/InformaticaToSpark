version: 2

models:
  - name: stg_rrr__customers
    description: Cleaned customer records; replaces Source Qualifier and Expression logic.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests:
          - not_null

  - name: stg_rrr__orders
    description: Incrementally loaded and standardized orders.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_rrr__customers')
              field: customer_id
      - name: amount
        tests:
          - not_null
          - non_negative
      - name: order_status
        tests:
          - accepted_values:
              values: ['NEW', 'PROCESSING', 'COMPLETE', 'CANCELLED']

